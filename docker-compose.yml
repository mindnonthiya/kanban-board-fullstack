
services:
  # 1. ฐานข้อมูล
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword123
      POSTGRES_DB: kanban_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend
  
  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app            #เชื่อมโฟลเดอร์ server
      - /app/node_modules       #ป้องกัน Docker ทับ library
    environment:
      - PORT=3000
      - DB_USER=postgres
      - DB_PASSWORD=mypassword123
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kanban_db
      - JWT_SECRET=kanban_secret_jwt_key_2026
    depends_on:
      - db

  # 3. Frontend (เพิ่ม Volumes เพื่อให้ Hot Reload ทำงาน)
  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app            # เชื่อมโฟลเดอร์ client
      - /app/node_modules       #ป้องกัน Docker ทับ library
    environment:
      - CHOKIDAR_USEPOLLING=true 
    depends_on:
      - server

volumes:
  postgres_data:
